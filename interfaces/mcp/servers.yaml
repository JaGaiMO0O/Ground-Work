# MCP server registry - what exists, what it costs, and when to turn it on.
#
# WHY THIS FILE EXISTS
# Tool definitions are re-sent to the model on EVERY turn of EVERY conversation.
# A database server and a ticketing server sitting idle in the tool list are a
# recurring tax, paid whether or not anything uses them - and on a long session
# that tax routinely exceeds the cost of the actual work.
#
# So: enable per TASK, not per project. Every recipe in context/recipes/ names
# the servers it needs. Where a script does the job, prefer the script: a
# script costs nothing until it is called.
#
# tool_count is the number that matters. Budget roughly 40-60 tokens per tool
# definition, per turn.

servers: []

